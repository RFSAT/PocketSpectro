name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Pinned rather than ubuntu-latest, which moves to Ubuntu 26 from 19 Oct 2026.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          # Open-source cache on top of actions/cache (the default "enhanced" provider is proprietary).
          cache-provider: basic

      - name: Make Gradle wrapper executable
        # Commits made on Windows store gradlew without the executable bit.
        run: chmod +x gradlew

      - name: Read app version
        run: |
          V=$(grep -oP 'val appVersion = "\K[^"]+' app/build.gradle.kts)
          IFS=. read -r MA MI PA <<< "$V"
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
          echo "APP_BUILD=$((MA * 10000 + MI * 100 + PA))" >> "$GITHUB_ENV"

      - name: Unit tests (protocol, drivers, processing, fire detection)
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: |
          ./gradlew --no-daemon :app:assembleDebug
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/PocketSpectro_v${APP_VERSION}-debug.apk"

      - name: Check signing secrets
        # Reports which secrets this run can see (never their values).
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          for n in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -n "${!n}" ]; then echo "$n: set"; else echo "$n: NOT visible"; missing="$missing $n"; fi
          done
          if [ -z "$missing" ]; then
            echo "HAS_KEYSTORE=true" >> "$GITHUB_ENV"
          else
            echo "HAS_KEYSTORE=false" >> "$GITHUB_ENV"
            echo "::warning::Not visible to this run (repo ${{ github.repository }}, event ${{ github.event_name }}):${missing}. They must be Repository secrets (Settings > Secrets and variables > Actions > Secrets tab) of this repository. The signed Google Play bundle (AAB) was not built."
          fi

      - name: Decode release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed Google Play bundle (AAB) and release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon :app:bundleRelease :app:assembleRelease
          AAB=app/build/outputs/bundle/release/app-release.aab
          # Refuse to publish an unsigned bundle: Play rejects it.
          jarsigner -verify "$AAB" | tee /tmp/verify.txt
          grep -q "jar verified" /tmp/verify.txt
          cp "$AAB" "dist/PocketSpectro_v${APP_VERSION}_build${APP_BUILD}.aab"
          cp app/build/outputs/apk/release/app-release.apk "dist/PocketSpectro_v${APP_VERSION}-release.apk"
          # R8 mapping (also inside the bundle, where Play reads it); kept for decoding stack traces later.
          cp app/build/outputs/mapping/release/mapping.txt "dist/PocketSpectro_v${APP_VERSION}_build${APP_BUILD}-mapping.txt"
          echo "### Google Play bundle ready: PocketSpectro_v${APP_VERSION}_build${APP_BUILD}.aab" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v7
        with:
          name: PocketSpectro-v${{ env.APP_VERSION }}-apk
          path: dist/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: env.HAS_KEYSTORE == 'true'
        with:
          name: PocketSpectro-v${{ env.APP_VERSION }}-play-bundle
          path: |
            dist/*.aab
            dist/*-mapping.txt
          if-no-files-found: error

  screenshots:
    # Renders every screen with the simulator (Robolectric + Roborazzi), including the Google Play set.
    # Runs on every push to main and on manual runs, alongside the build; skipped for pull requests.
    # Map screens download real tiles, so a network hiccup here never fails the build.
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          # Both jobs compute the same cache key; only the build job saves it, so the two parallel jobs
          # no longer race to write it ("Unable to reserve cache ... another job may be creating this cache").
          cache-read-only: true
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Render screenshots
        run: ./gradlew --no-daemon :app:testDebugUnitTest -Pscreenshots --tests '*ScreenshotTest*'
      - uses: actions/upload-artifact@v7
        if: always()   # keep whatever rendered, even if one screen timed out
        with:
          name: PocketSpectro-screenshots
          path: app/build/screenshots/*.png
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          # 1080 x 1920, 24-bit PNG, no version shown: ready for the Play listing.
          name: PocketSpectro-play-screenshots
          path: app/build/screenshots/play/*.png
