name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Pinned rather than ubuntu-latest, which moves to Ubuntu 26 from 19 Oct 2026.
    runs-on: ubuntu-24.04
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          # Open-source cache on top of actions/cache (the default "enhanced" provider is proprietary).
          cache-provider: basic

      - name: Make Gradle wrapper executable
        # Commits made on Windows store gradlew without the executable bit.
        run: chmod +x gradlew

      - name: Read app version
        run: |
          echo "APP_VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_ENV"
          echo "APP_BUILD=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)" >> "$GITHUB_ENV"

      - name: Unit tests (protocol, drivers, processing, fire detection)
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: |
          ./gradlew --no-daemon :app:assembleDebug
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/PocketSpectro_v${APP_VERSION}-debug.apk"

      - name: No signing secrets
        if: env.HAS_KEYSTORE != 'true'
        run: echo "::warning::KEYSTORE_BASE64 / STORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD are not set, so the signed Google Play bundle (AAB) was not built."

      - name: Decode release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed Google Play bundle (AAB) and release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon :app:bundleRelease :app:assembleRelease
          AAB=app/build/outputs/bundle/release/app-release.aab
          # Refuse to publish an unsigned bundle: Play rejects it.
          jarsigner -verify "$AAB" | tee /tmp/verify.txt
          grep -q "jar verified" /tmp/verify.txt
          cp "$AAB" "dist/PocketSpectro_v${APP_VERSION}_build${APP_BUILD}.aab"
          cp app/build/outputs/apk/release/app-release.apk "dist/PocketSpectro_v${APP_VERSION}-release.apk"
          echo "### Google Play bundle ready: PocketSpectro_v${APP_VERSION}_build${APP_BUILD}.aab" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v7
        with:
          name: PocketSpectro-v${{ env.APP_VERSION }}-apk
          path: dist/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: env.HAS_KEYSTORE == 'true'
        with:
          name: PocketSpectro-v${{ env.APP_VERSION }}-play-bundle
          path: dist/*.aab
          if-no-files-found: error

  screenshots:
    # Renders every screen with the simulator (Robolectric + Roborazzi). Run manually.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Render screenshots
        run: ./gradlew --no-daemon :app:testDebugUnitTest -Pscreenshots --tests '*ScreenshotTest*'
      - uses: actions/upload-artifact@v7
        with:
          name: PocketSpectro-screenshots
          path: app/build/screenshots/*.png
